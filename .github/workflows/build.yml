name: Build

# 只做编译检查，不打包、不发布、不跑测试。
# 目的是让 macOS 上的开发及早发现 Windows 侧的编译问题。
# Windows job 随 push 自动运行，macOS job 仅手动触发（见下方注释）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_macos:
        description: '同时在 macOS 上构建（runner 排队较久）'
        type: boolean
        default: true

jobs:
  # macOS 是本地开发平台，每次本地构建都已验证编译与启动，
  # 因此这个 job 不随 push 自动运行 —— GitHub 的 macOS runner 排队太久。
  # 它只覆盖一件本地做不到的事：从干净 checkout 构建，发现漏提交的源文件。
  # 需要时用 workflow_dispatch 手动触发。
  macos:
    name: macOS
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_macos
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: mac
          target: desktop
          arch: clang_64
          modules: ''

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset macos-release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build --preset macos-release

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 本地开发用 Qt 6.12.0，这里只能用 6.10.3。
      # 原因：Qt 从 6.11.0 起改变了 Windows 仓库的目录布局，
      # Updates.xml 从 qt6_6120/qt6_6120/ 移到了 qt6_6120/qt6_6120_msvc2022_64/，
      # 而 aqtinstall 3.3.0（当前最新）仍按旧布局查找，于是报
      # "Failed to locate XML data for Qt version"。6.10.3 是旧布局下的最后一个版本。
      # macOS 侧不受影响，仍用 6.12.0。
      # 等 aqtinstall 支持新布局后，这里应改回与本地一致的版本。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ''

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release
